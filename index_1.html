<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f7f4ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>全屋訂製・估價系統</title>
<style>
:root{
  --cute:"Huninn","jf-openhuninn-2.0","Yuanti TC","Hannotate TC","Hanzipen TC","Kaiti TC",cursive;
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px auto;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;margin-right:10px;text-decoration:none;color:inherit;flex:none}
.logo img{height:42px;width:auto;display:block}
.logo .logo-txt{font-weight:700;font-size:15px;letter-spacing:1px;color:var(--ink,#3b2f26)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line);scrollbar-width:none;-ms-overflow-style:none}
aside::-webkit-scrollbar{display:none;width:0;height:0}
.sarrow{position:sticky;height:0;z-index:7;width:100%;pointer-events:none}
.sarrow.up{top:0}.sarrow.dn{bottom:0}
.sarrow button{position:absolute;left:50%;transform:translateX(-50%);pointer-events:auto;width:32px;height:18px;padding:0;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.92);color:var(--muted);font-size:9px;line-height:1;cursor:pointer;transition:opacity .15s}
.sarrow.up button{top:4px}.sarrow.dn button{bottom:4px}
.sarrow.off button{opacity:0;pointer-events:none}
.sarrow button:hover{color:var(--accent);border-color:var(--accent)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
.item.tool{cursor:pointer}.item.tool.on{border-color:var(--accent);background:#f6e9de;box-shadow:0 0 0 1px var(--accent) inset}
.item.tool small{text-align:center}
table.qt td:first-child:not(.muted),table.qt td:first-child:not(.muted){font-weight:700}
table.qt,table.qt{table-layout:fixed;width:100%;background:none}
table.qt td,table.qt td{background:none;padding:6px 4px}
table.qt td:first-child,table.qt td:first-child{width:36%}
table.qt td:not(:first-child),table.qt td:not(:first-child){width:32%}
table.qt td:first-child,table.qt td:first-child{overflow-wrap:anywhere}
tr.thead td{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.btn.icon{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px}.btn.icon svg{width:18px;height:18px;display:block}
[data-dim]{cursor:pointer}
.item svg{width:56px;height:44px}
#lib .lib-grid.struct{grid-template-columns:1fr 1fr}
.item.tool svg{width:100%;max-width:84px;height:48px}
.item.tool b{font-size:12px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
/* 開門 / 開放 同品項並排：色條 + 角標分辨 */
.item{position:relative}
.item .tg{position:absolute;top:4px;left:4px;font-style:normal;font-size:10px;line-height:1;padding:2px 6px;border-radius:8px;color:#fff;letter-spacing:.5px;pointer-events:none}
.item .tg.door{background:var(--accent)}
.item .tg.open{background:var(--teal)}
.item .tg.slide{background:#8a8174}
.item[data-mode=door]{border-bottom:3px solid var(--accent)}
.item[data-mode=open]{border-bottom:3px solid var(--teal);background:#f4f9f8}
.item[data-mode=slide]{border-bottom:3px solid #8a8174}
/* 模型庫懸停 3D 預覽 */
#libPrev{position:fixed;z-index:40;width:260px;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(40,30,20,.25);pointer-events:none;display:none;overflow:hidden}
#libPrev .pvc{width:260px;height:200px;overflow:hidden;background:#fff}
#libPrev canvas{display:block;width:260px;height:200px}
#libPrev b{display:block;margin-top:6px;font-size:13px}
#libPrev small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:#fffefc}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure,#plan.tool-ruler{cursor:crosshair}
#marqBtn{display:none!important}
#plan.marq{cursor:crosshair}
#plan.panmode{cursor:grab}
#plan .wall{pointer-events:none}
#plan.tool-select .wall{pointer-events:all;cursor:pointer}
#plan.tool-select [data-oid]{cursor:pointer}
#plan.tool-wall,#plan.tool-room,#plan.tool-door,#plan.tool-entry,#plan.tool-win,#plan.tool-slide,#plan.tool-bal,#plan.tool-wslide{cursor:crosshair}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size],[data-handle=sizeTL]{cursor:nwse-resize}
[data-handle=sizeTR],[data-handle=sizeBL]{cursor:nesw-resize}
[data-handle=sizeL],[data-handle=sizeW]{cursor:ew-resize}
[data-handle=sizeD],[data-handle=sizeT]{cursor:ns-resize}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
table.qt tr.click:hover td{background:none}
table.qt.grouped td:first-child{font-weight:400;padding-left:12px}
table.qt.grouped tr.rm td:first-child{font-weight:700;padding-left:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:flex-end;gap:14px;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:#fff;cursor:pointer;text-align:center}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
.qacts{justify-content:flex-end}.qacts .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#quoteDock{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);border-top:1px solid var(--line);position:relative;z-index:8}
#quoteDock .chips{display:flex;gap:8px;min-width:0;justify-content:center;overflow-x:auto;scrollbar-width:none}
#quoteDock .chips::-webkit-scrollbar{display:none}
#quoteDock .acts{display:flex;gap:6px;flex:none;justify-self:end}
.qchip{display:flex;flex-direction:column;line-height:1.25;padding:3px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}
.qchip small{color:var(--muted);font-size:11px}.qchip b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qchip[data-q]{cursor:pointer;user-select:none}.qchip[data-q].on{border-color:var(--accent);background:var(--accent-soft)}
.qchip.tot{background:var(--accent-soft);border-color:transparent}.qchip.tot b{color:var(--accent)}
#quoteDock .btn{border:1px solid var(--line);background:#fff;padding:8px 14px}#quoteDock .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:700px){#quoteDock{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 8px;gap:6px}#quoteDock .chips{justify-content:center;flex-wrap:wrap}#quoteDock .acts{justify-self:center}#quoteDock .dockpad{display:none}.qchip{padding:2px 8px}#quoteDock .btn{padding:7px 9px;font-size:12px}}
.qbox .qsum{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;line-height:1.6}.qbox .qsum b{color:var(--accent);font-size:16px}.qbox .qsum small{color:var(--muted)}
.qbox input.bad{border-color:#b3372a;background:#fff6f4}
.qbox .qlinks{display:flex;flex-direction:column;gap:8px}
.qbox a.btn,.qbox .qlinks .btn{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);padding:10px;border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.qbox a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.qbox.qdone{width:min(540px,100%);padding:34px 28px 26px;border-radius:20px;text-align:center;align-items:center;gap:0}
.qdone h3{font-size:22px;margin:0 0 16px}.qdone .q1{font-size:17px;color:#444;margin:0}.qdone .q2{font-size:13px;color:#8a8174;margin:14px 0 26px}
.qdone .qbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.qdone .qbtns a,.qdone .qbtns button{border:1px solid #ddd;background:#fff;color:#222;border-radius:30px;padding:12px 26px;font-size:16px;cursor:pointer;text-decoration:none;font-family:inherit}
.qdone .qbtns .ln{background:#06c755;border-color:#06c755;color:#fff;font-weight:700}
.qdone .q3{font-size:13px;color:#8a8174;margin:22px 0 0}.qdone .q3 a{color:#2a5bd7}
.qmask{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.qbox{background:#fff;border-radius:14px;padding:18px 20px;width:min(400px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(40,30,20,.3)}
.qbox h3{margin:0 0 2px;font-size:16px}.qbox label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.qbox input,.qbox select{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:14px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.qbox .qerr{color:#b3372a;font-size:12px;min-height:0}.qbox .qnote{font-size:12px;color:var(--muted);line-height:1.5}
.qbox .actions{justify-content:flex-end;margin-top:2px}.qbox .actions .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
#wallLenBox{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;box-shadow:0 4px 16px rgba(40,30,20,.15);z-index:4}
#wallLenBox input{width:110px;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#wallLenBox .btn{border:1px solid var(--line);background:#fff;padding:4px 8px}
#wallLenBox .btn.primary{background:var(--accent);color:#fff}
/* ---------- 2D / 3D 切換 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
body.m3d #lib{display:none!important}   /* 3D 僅可瀏覽：不顯示可放置的模型庫 */
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-family:var(--cute);font-size:13px;font-weight:400;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left;display:flex;align-items:center;gap:8px}
.menu.left .menu-pop{left:0;right:auto}
.menu summary{display:flex;align-items:center;gap:6px;cursor:pointer}.menu summary .car{font-style:normal;font-size:11px;opacity:.7}
.ic{width:16px;height:16px;flex:none}.sub{display:contents}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 選中後的浮動工具條 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
@media (min-width:1101px){#fab.onlyprop{display:none}}   /* 寬屏沒有可按的東西時不顯示 */
/* ---------- 觸控螢幕漫遊搖桿 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 觸控螢幕：加大點擊區域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 豎屏 / 窄屏（如 iPad 豎握）：側欄改為抽屜 ---------- */
/* ---------- 寬屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起動畫中內容不被擠壓變形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
#gFurn.white *{fill:#fff!important}#gFurn.white text{fill:#4a443c!important}#gFurn.white [stroke]{stroke:#9b958b!important}
/* ---------- 手機 / 平板：依裝置類型自動調整介面文字與觸控尺寸（--uiz 由腳本依螢幕寬度設定） ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
header,aside,footer,#quoteDock{zoom:var(--uiz,1)}
body[data-dev=phone] header{gap:4px 6px;padding:6px 8px}
body[data-dev=phone] .brand span{display:none}
body[data-dev=phone] .btn{padding:7px 9px;min-height:36px}
body[data-dev=phone] .lib-grid{grid-template-columns:1fr 1fr}
body[data-dev=tablet] .btn{min-height:42px}
@media (orientation:landscape) and (max-height:480px){header{padding:3px 8px;gap:3px 6px}.brand{display:none}}
@media (max-width:700px){.logo img{height:34px}}

/* ===== 框選：在空白處拖曳框出範圍，框到的家具 / 牆 / 門窗 / 房間一起選取，可整批移動、刪除 =====
   由左往右拖 = 「完全框住」才選取；由右往左拖 = 「碰到」就選取（與 CAD 相同）。 */
const OPEN_KEYS = ['doors','slides','wins','arches'];
let spaceDown = false;
const emptySets = () => ({furn:[], walls:[], opens:[], rooms:[]});
function selSets(){
  const s = ui.sel, o = emptySets(); if (!s) return o;
  if (s.kind === 'furn') o.furn.push(s.id); else if (s.kind === 'multi') o.furn.push(...s.ids);
  else if (s.kind === 'wall') o.walls.push(s.id); else if (s.kind === 'wmulti') o.walls.push(...s.ids);
  else if (s.kind === 'open') o.opens.push(s.id); else if (s.kind === 'room') o.rooms.push(s.id);
  else if (s.kind === 'mix'){ o.furn.push(...s.furn); o.walls.push(...s.walls); o.opens.push(...s.opens); o.rooms.push(...s.rooms); }

}
function normSel(o){
  const n = o.furn.length + o.walls.length + o.opens.length + o.rooms.length;
  if (!n) return null;
  if (n === 1) return o.furn.length ? {kind:'furn', id:o.furn[0]} : o.walls.length ? {kind:'wall', id:o.walls[0]} : o.opens.length ? {kind:'open', id:o.opens[0]} : {kind:'room', id:o.rooms[0]};
  if (o.furn.length === n) return {kind:'multi', ids:o.furn};

const setSel = o => select(normSel(o));
const selCount = () => { const o = selSets(); return o.furn.length + o.walls.length + o.opens.length + o.rooms.length; };
// 取出一組選取物件目前的位置（選到牆時，牆上的門窗一併帶著走）
function groupItems(o){
  const L = state.layout, att = new Set(o.opens);
  o.walls.map(wallOf).filter(Boolean).forEach(w => OPEN_KEYS.forEach(k => L[k].forEach(q => {
    if (q.rect[0] >= w.x0 && q.rect[1] >= w.y0 && q.rect[2] <= w.x1 && q.rect[3] <= w.y1) att.add(q.id); })));
  return {
    furn: o.furn.map(getF).filter(Boolean).map(f => ({f, cx:f.cx, cy:f.cy})),
    walls: o.walls.map(wallOf).filter(Boolean).map(w => ({w, x0:w.x0, y0:w.y0, x1:w.x1, y1:w.y1})),
    opens: [...att].map(openOf).filter(Boolean).map(q => ({o:q.o, r:q.o.rect.slice()})),
    rooms: o.rooms.map(id => L.rooms.find(r => r.id === id)).filter(Boolean).map(r => ({r, poly:r.poly.map(p => p.slice()), at:r.at && r.at.slice(), holes:(r.holes || []).map(h => h.map(p => p.slice()))}))

function applyGroup(it, dx, dy){
  it.furn.forEach(a => { a.f.cx = a.cx + dx; a.f.cy = a.cy + dy; });
  it.walls.forEach(a => { a.w.x0 = a.x0 + dx; a.w.x1 = a.x1 + dx; a.w.y0 = a.y0 + dy; a.w.y1 = a.y1 + dy; });
  it.opens.forEach(a => { for (let i = 0; i < 4; i++) a.o.rect[i] = a.r[i] + (i % 2 ? dy : dx); });
  it.rooms.forEach(a => { a.r.poly = a.poly.map(p => [p[0]+dx, p[1]+dy]); if (a.at) a.r.at = [a.at[0]+dx, a.at[1]+dy]; if (a.holes.length) a.r.holes = a.holes.map(h => h.map(p => [p[0]+dx, p[1]+dy])); });

function applyMarquee(mq, add){

/* ======================= 幾何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const roomVert = r => { const b = bbox(r.poly); return (b[3]-b[1]) > (b[2]-b[0]); };   // 長軸是否為縱向（Y）
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;

function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

/* ======================= 家具圖例 ======================= */
const ST = 'stroke="#5f564e" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

const UPPER_D = 330;   // 廚具上櫃深度 mm
// 衣櫃平面圖示：標準吊衣符號——沿掛衣桿排列的一排斜線（俯視看到的吊掛衣物）
const hangers = (x, cy, w, d, secW = 500) => {
  const n = Math.max(1, Math.round(w/secW)), sw = w/n, h = Math.max(40, Math.min(d*.28, 150)), step = 90; let o = '';
  for (let i = 0; i < n; i++){
    const span = Math.max(sw*.5, sw - 120), x0 = x + sw*i + (sw - span)/2, k = Math.max(1, Math.floor(span/step)), gap = span/k;
    for (let j = 0; j < k; j++){ const px = x0 + gap*(j + .5); o += ln(px - h*.35, cy + h, px + h*.35, cy - h, 'opacity=".75"'); }
  }
  return o;
};
function furnSVG(t,w,d,c){

  switch (t){
    case 'bed': {
      let s = rc(x,y,w,d,'#fbf8f2','rx="30"') + rc(x,y,w,Math.min(90,d*.05),shade(c,.62),'rx="20"');
      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');

      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));
      return s;
    }
    case 'sofa': case 'armchair': {

      let s = rc(x,y,w,d,dk,'rx="60"');

      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,a,d,dk,'rx="50"') + rc(x+w-a,y,a,d,dk,'rx="50"');
    }
    case 'cornersofa': {

      for (let i = 0; i < n; i++){ const a = x+10 + (w-20)*(i+.5)/n, b = x+10 + (w-20)*(i+1)/n; p += `L${a} ${y+8}L${b} ${y+d-8}`; } return s + pa(p,'none','opacity=".6"'); }
    case 'woodblind': { let s = rc(x,y,w,d,c,'rx="10"'); const n = Math.max(8, Math.round(w/45));
      for (let i = 1; i < n; i++){ const px = x + w*i/n; s += ln(px-d*.2,y+d-6,px+d*.2,y+6,'opacity=".6"'); } return s + ln(x,y+d/2,x+w,y+d/2,'opacity=".35"'); }
    case 'dimroll': { const r = Math.min(d*.42, 38); return rc(x,y,w,d,c,'rx="12"') + ln(x+r*2.2,y+d/3,x+w-r*2.2,y+d/3,DASH) + ln(x+r*2.2,y+d*2/3,x+w-r*2.2,y+d*2/3,DASH)
      + ec(x+r*1.1,y+d/2,r,r,'#efece6') + ec(x+w-r*1.1,y+d/2,r,r,'#efece6'); }
    case 'roller': { const r = Math.min(d*.42, 30); return rc(x,y,w,d,c,'rx="12"') + ec(x+r*1.1,y+d/2,r,r,'#fff') + ec(x+w-r*1.1,y+d/2,r,r,'#fff') + ln(x+r*2.1,y+d/2,x+w-r*2.1,y+d/2); }
    case 'vsheer': { let s = rc(x,y,w,d,c,'rx="12" fill-opacity=".5"'); const n = Math.max(6, Math.round(w/90));
      for (let i = 0; i < n; i++){ const px = x + w*(i+.5)/n, q = Math.min(40, w/n*.4); s += ln(px-q,y+d*.8,px+q,y+d*.2,'opacity=".8"'); } return s; }
    case 'cabinet': case 'shoecab': return rc(x,y,w,d,c) + ln(x,y+d,x+w,y);
    case 'wardrobeopen': { let s = rc(x,y,w,d,shade(c,1.06)) + rc(x+25,y+25,w-50,d-50,shade(c,.84)); const n = Math.max(1, Math.round(w/500));   // 開放：無門片，看得到內腔
      for (let i = 1; i < n; i++) s += ln(x+w*i/n,y+25,x+w*i/n,y+d-25,'opacity=".7"'); return s + ln(x+60,0,x+w-60,0,DASH) + hangers(x, 0, w, d); }
    case 'lowcab': case 'semicab': case 'tvcab': case 'wallcab': case 'tallcab': {
      let s = rc(x,y,w,d,c,t === 'wallcab' ? DASH : '') + rc(x,y+d-35,w,35,shade(c,.88)); const n = Math.max(1, Math.round(w/450)), pw = w/n;   // 實心櫃身 + 前緣門板
      if (t === 'tallcab') s += rc(x+16,y+16,w-32,d-48,'none','opacity=".4"');   // 高櫃：內縮雙線
      for (let i = 0; i < n; i++){ const px = x + i*pw; if (i) s += ln(px,y+d*.5,px,y+d); s += ln(px+(i%2 ? pw : 0),y+d,px+(i%2 ? 0 : pw),y+d*.4,'opacity=".6"'); }
      return s; }
    case 'lowcabopen': case 'semicabopen': case 'tvcabopen': case 'wallcabopen': case 'tallcabopen': {
      let s = rc(x,y,w,d,shade(c,1.06),t === 'wallcabopen' ? DASH : '') + rc(x+30,y+30,w-60,d-60,shade(c,.84),'opacity=".95"'); const n = Math.max(1, Math.round(w/450));   // 開放：淺色外框 + 深色內腔
      if (t === 'tallcabopen') s += rc(x+14,y+14,w-28,d-28,'none','opacity=".4"');
      for (let i = 1; i < n; i++) s += ln(x+w*i/n,y+30,x+w*i/n,y+d-30,'opacity=".7"');
      return s; }
    case 'studydesk': return rc(x,y,w,d,c);   // 書桌/化妝桌：單純長方形
    case 'dresser': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.2,y,w*.6,55,'#dfe9ee');

    case 'chair': return rc(x+25,y+d*.16,w-50,d*.84-10,c,'rx="60"') + rc(x,y,w,d*.2,shade(c,.78),'rx="40"');
    case 'bookshelf': { let s = rc(x,y,w,d,c); for (let bx = x+400; bx < x+w-50; bx += 400) s += ln(bx,y,bx,y+d); return s; }
    case 'baycushion': return rc(x,y,w,d,c,'rx="60"') + rc(x+60,y+80,w-120,Math.min(300,d*.2),'#fff','rx="60"') + rc(x+60,y+d-80-Math.min(300,d*.2),w-120,Math.min(300,d*.2),'#fff','rx="60"');
    case 'coffeetable': return rc(x,y,w,d,c,'rx="80"') + rc(x+60,y+60,w-120,d-120,shade(c,1.06),'rx="50"');

    case 'roundrug': return ec(0,0,w/2,d/2,c,'fill-opacity=".75"') + ec(0,0,w/2-130,d/2-130,'#eceded','opacity=".8"') + ec(0,0,w/2-330,d/2-330,'#f6f6f5','opacity=".9"');
    case 'rug': return rc(x,y,w,d,c,'rx="40" fill-opacity=".6"') + rc(x+90,y+90,w-180,d-180,'none','rx="30" stroke-dasharray="3 3" opacity=".6"');
    case 'plant': {

      for (let k=0;k<8;k++) s += `<ellipse cx="0" cy="${-m*.27}" rx="${m*.1}" ry="${m*.21}" transform="rotate(${k*45})" fill="#8d9a52" ${ST}/>`;

    case 'table': return rc(x,y,w,d,c,'rx="30"') + rc(x+50,y+50,w-100,d-100,'none','rx="20" opacity=".4"');

    case 'counter': {   // 廚具上下櫃：下櫃（實線）+ 上櫃（虛線，貼牆）
      const n = Math.max(1, Math.round(w/600)), ud = Math.min(UPPER_D, d*.6); let s = rc(x,y,w,d,c) + rc(x,y+d-35,w,35,shade(c,.88));
      for (let i = 1; i < n; i++) s += ln(x+w*i/n,y+d*.5,x+w*i/n,y+d);

    case 'stove': {

      return s;
    }
    case 'ksink': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.1,y+d*.2,w*.8,d*.66,'#fff','rx="60"') + ec(0,y+d*.53,w*.05,w*.05,'#e3e6e8') + `<circle cx="0" cy="${y+d*.09}" r="22" fill="#999"/>`;
    case 'fridge': return rc(x,y,w,d,c,'rx="40"') + rc(x+w*.07,y+d*.07,w*.86,d*.86,'#fff','rx="30" fill-opacity=".6"')
      + [0,1,2,3].map(i => ln(x+w*.22, y+d*.15+i*d*.05, x+w*.78, y+d*.15+i*d*.05, 'opacity=".45"')).join('')
      + rc(x+w*.18, y+d*.86, w*.64, d*.04, '#b9bec4', 'rx="20"');   // 上視圖：頂面、後方散熱格柵、前緣把手
    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'shower5': { const k = Math.min(w,d)*.42, X = x+w, Y = y+d;   // 五角：左上靠牆角，右下切角為斜向玻璃門
      return pa(`M${x} ${y}H${X}V${Y-k}L${X-k} ${Y}H${x}Z`, c) + ln(X,y,X,Y-k,DASH) + ln(X,Y-k,X-k,Y,DASH) + ln(X-k,Y,x,Y,DASH) + `<circle cx="${-k*.2}" cy="${-k*.2}" r="45" fill="#fff" ${ST}/>`; }
    case 'pillar': return rc(x,y,w,d,'#75716c');   // 與牆同色
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {
      let s = rc(x,y,w,d,c,'rx="20"') + rc(x+45,y+45,w-90,d-90,'#fff','rx="20"');
      for (let sx = x+90; sx < x+w-60; sx += 90) s += ln(sx,y,sx,y+45,'opacity=".5"') + ln(sx,y+d-45,sx,y+d,'opacity=".5"');
      return s;
    }
    case 'beanbag': return ec(0,0,w/2,d/2,c) + ec(-w*.04,-d*.06,w*.3,d*.28,shade(c,1.12),'opacity=".9"');
    case 'sidetable': return ec(0,0,w/2,d/2,c) + ec(0,0,w*.12,d*.12,'none','opacity=".5"');
    case 'floorlamp': return `<circle r="${m*.5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m*.32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m*.07}" fill="${c}" ${ST}/>`;
    case 'island': return rc(x,y,w,d,c) + ln(x,y+d-250,x+w,y+d-250,DASH);
    case 'barstool': return `<circle r="${m/2}" fill="${c}" ${ST}/><circle r="${m*.3}" fill="${shade(c,1.15)}" ${ST}/>`;
    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {
      let s = rc(x,y,w,d,c,`rx="30" ${DASH}`);

      return s;
    }
    case 'dishwasher': return rc(x,y,w,d,c,'rx="15"') + ln(x,y+d-70,x+w,y+d-70) + rc(x+w*.3,y+d-45,w*.4,25,'#888');
    case 'ovencol': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d) + ln(x+w,y,x,y+d);
    case 'purifier': return rc(x,y,w,d,c,'rx="60"') + rc(x+45,y+45,w-90,d-90,'none',`rx="40" ${DASH}`);
    case 'officechair': {
      let s = '';
      for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${k*72+36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"');
    }
    case 'piano': {
      let s = rc(x,y,w,d*.55,c,'rx="10"') + rc(x+40,y+d*.55,w-80,d*.4,shade(c,1.4),'rx="10"');
      const kx = x+90, kw = w-180, kd = d*.2;
      s += rc(kx,y+d*.55,kw,kd,'#faf8f3');
      for (let i = 1; i < 26; i++) s += ln(kx+kw*i/26,y+d*.55,kx+kw*i/26,y+d*.55+kd,'opacity=".5"');
      return s;
    }
    case 'treadmill': return rc(x,y,w,d,c,'rx="50"') + rc(x+90,y+320,w-180,d-400,'#1c1c1e','rx="25"') + rc(x,y,w,230,shade(c,1.4),'rx="40"');
    default: return rc(x,y,w,d,c);
  }
}

/* ======================= 算圖 ======================= */
const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  const rpath = r => 'M' + r.poly.map(p => p.join(',')).join('L') + 'Z' + (r.holes || []).map(h => 'M' + h.map(p => p.join(',')).join('L') + 'Z').join('');
  ROOMS.forEach(r => s += `<path class="room" data-room="${r.id}" fill-rule="evenodd" d="${rpath(r)}" fill="url(#m-${state.rooms[r.id].mat}${(state.rooms[r.id].mat === 'wood' || state.rooms[r.id].mat === 'spc') && roomVert(r) ? 'V' : ''})"/>`);
  const sill = ([a,b,c,d]) => `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  DOORS.forEach(d => s += sill(d.rect)); SLIDES.forEach(d => s += sill(d.rect));
  $('#gRooms').innerHTML = s;
}


/* ===== 2D 高度陰影：依物件高度（mm）把投影往右下方拉長，越高陰影越長越柔，讓平面圖更立體 ===== */
const FURN_H = {bed:500, crib:900, nightstand:500, chair:450, officechair:900, barstool:650, curtain:800, plant:900, sofa:850, cornersofa:850, armchair:850, beanbag:500,
  coffeetable:400, sidetable:500, table:750, roundtable:750, rug:0, roundrug:0, floorlamp:1600, tv:800, piano:1300, treadmill:1300,
  toilet:400, vanity:850, shower:2000, shower5:2000, pillar:3000, bathtub:550, washer:850, counter:850, island:900, stove:850, ksink:850, fridge:1800, dishwasher:850, ovencol:2100,
  desk:750, bookshelf:1800, dresser:900, cabinet:900, shoecab:900, tvstand:500};
CURT_TYPES.forEach(t => FURN_H[t] = 800);
const ROUND_TYPES = new Set(['roundtable','plant','barstool','beanbag','floorlamp']);
function furnTop(f){
  if (isWall(f)) return cabZ(f) + (cabHeight(f) || 700);
  if (isTV(f)) return cabZ(f) + cabHeight(f);
  if (CAB_DEF[f.type]) return CAB_H[f.type] || 2400;
  return FURN_H[f.type] ?? 600;
}
function shadowShape(f, dx, dy){
  const t = `translate(${f.cx+dx} ${f.cy+dy}) rotate(${f.rot})`;
  return ROUND_TYPES.has(f.type)
    ? `<ellipse transform="${t}" rx="${f.w/2}" ry="${f.d/2}"/>`
    : `<rect transform="${t}" x="${-f.w/2}" y="${-f.d/2}" width="${f.w}" height="${f.d}" rx="20"/>`;
}
function renderShadowsF(){
  const g = $('#gShadowF'); g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  const band = [[],[],[]];
  state.furniture.forEach(f => {
    const top = furnTop(f); if (top <= 0) return;
    const off = Math.min(420, top*.16), d = off*.75, floating = isWall(f) || (isTV(f) && cabZ(f) > 0);
    const steps = floating ? 1 : Math.max(1, Math.min(6, Math.ceil(off/70)));
    const i = top < 700 ? 0 : top < 1500 ? 1 : 2;
    if (floating) band[i].push(shadowShape(f, d, d));
    else for (let k = 1; k <= steps; k++) band[i].push(shadowShape(f, d*k/steps, d*k/steps));
  });
  g.innerHTML = band.map((a,i) => a.length ? `<g filter="url(#shb${i+1})" fill="#3b2c1e" fill-opacity="${[.2,.17,.15][i]}">${a.join('')}</g>` : '').join('');
}
function renderShadowsW(){
  const d = 230, st = [0,.34,.67,1];
  $('#gShadowW').innerHTML = `<g filter="url(#shb2)" fill="#3b2c1e" fill-opacity=".2">${WALLS.map(([x0,y0,x1,y1,k]) => {
    if (k === 'low') return '';
    return st.map(t => `<rect x="${x0+d*t}" y="${y0+d*t}" width="${x1-x0}" height="${y1-y0}"/>`).join('');
  }).join('')}</g>`;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = false && Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('') + seamPatches().map(([x,y,w,h,c]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" pointer-events="none"/>`).join('') + kitchenExtSVG();
  renderShadowsF();
}

function renderWalls(){
  $('#gWalls').innerHTML = WALLS.map(w => {
    const [x0,y0,x1,y1,k,id] = w, on = (ui.sel?.kind === 'wall' && ui.sel.id === id) || (ui.sel?.kind === 'wmulti' && ui.sel.ids.includes(id)) || (ui.sel?.kind === 'mix' && ui.sel.walls.includes(id));
    const fill = k==='low' ? '#e9e3d8' : k==='e' ? '#6a6662' : '#75716c';
    const ex = on ? 'stroke="#b5653a" stroke-width="2.5" vector-effect="non-scaling-stroke"' : 'stroke="#4a4540" stroke-width="1" vector-effect="non-scaling-stroke"';
    return `<rect class="wall" data-wall="${id}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${fill}" ${ex}/>`;
  }).join('');
  renderShadowsW();
}

function renderOpenings(){
  const WS = 'stroke="#5f564e" stroke-width="1" vector-effect="non-scaling-stroke"';
  let s = '';
  ARCHES.forEach(a => { const [x0,y0,x1,y1] = a.rect; s += `<rect data-oid="${a.id}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="rgba(255,255,255,.01)" stroke="#8f897d" stroke-width="1" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`; });
  WINS.forEach(([x0,y0,x1,y1], wi) => {
    const w = x1-x0, h = y1-y0;
    s += `<rect data-oid="${WINIDS[wi]}" x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff" ${WS}/>`;
    if (w >= h) [1/3,2/3].forEach(t => s += `<line x1="${x0}" y1="${y0+h*t}" x2="${x1}" y2="${y0+h*t}" ${WS}/>`);
    else [1/3,2/3].forEach(t => s += `<line x1="${x0+w*t}" y1="${y0}" x2="${x0+w*t}" y2="${y1}" ${WS}/>`);
  });
  const DS = 'stroke="#5f564e" stroke-width="1" vector-effect="non-scaling-stroke"';
  DOORS.forEach(d => {
    const [hx,hy] = d.h, L = d.len, T = 40; const [rx0,ry0,rx1,ry1] = d.rect;
    s += `<rect data-oid="${d.id}" x="${rx0}" y="${ry0}" width="${rx1-rx0}" height="${ry1-ry0}" fill="rgba(255,255,255,.01)"/>`;
    const ox = hx + d.o[0]*L, oy = hy + d.o[1]*L, cx = hx + d.c[0]*L, cy = hy + d.c[1]*L;
    const sweep = d.o[0]*d.c[1] - d.o[1]*d.c[0] > 0 ? 1 : 0;
    const col = '#5f564e';
    s += `<polygon points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="${d.glass ? '#dff0f7' : '#fff'}" stroke="${col}" stroke-width="${d.entry?1.8:1}" vector-effect="non-scaling-stroke"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} opacity=".75"/>`;
  });
  SLIDES.forEach(({id,rect:[x0,y0,x1,y1],v,kind,sd,flip}) => {   // 拉門：牆開口後，門片裝在牆的單一側（不卡在牆內）

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod) return;
  if (ui.tool === 'wall' && ui.draw && ui.chain && /^[0-9]$/.test(e.key)){ e.preventDefault(); const i = $('#wallLenIn'); i.focus(); i.value = e.key; previewLen(); return; }
  if (k === '[' || k === ']'){ drawer(k === '[' ? 'lib' : 'panel'); return; }
  if (k === 't') setView(is3D() ? '2d' : '3d');
  else if (is3D() && ['v','m','r','f','+','=','-'].includes(k)) return;
  else if (k === 'v') setTool('select');
  else if (k === 'm') setTool('measure');
  else if (k === 'r') setTool('ruler');
  else if (k === 'f') fitView();
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); deleteSel(); }
  else if (k === 'escape'){ if (ui.chain) endChain(); else if (ui.mA || ui.rA){ ui.mA = ui.mB = ui.mChain = ui.rA = ui.rCur = null; renderMeasure(); } else { if (ui.tool !== 'select') setTool('select'); select(null); } }
  else if (k.startsWith('arrow') && !is3D() && (ui.sel?.kind === 'furn' || ui.sel?.kind === 'multi')){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => selIds().forEach(id => { const f = getF(id); if (!f) return; if (k==='arrowleft') f.cx -= st; if (k==='arrowright') f.cx += st; if (k==='arrowup') f.cy -= st; if (k==='arrowdown') f.cy += st; }));
  }
  else if (k.startsWith('arrow') && !is3D() && (ui.sel?.kind === 'wmulti' || ui.sel?.kind === 'mix')){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10, dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
    mutate(() => applyGroup(groupItems(selSets()), dx, dy));
  }
  else if (k === '+' || k === '=') zoomCenter(1.25);
  else if (k === '-') zoomCenter(.8);
});

// 房門：淺木紋貼圖（垂直木紋，程式生成、固定亂數種子）
let _doorWood = null;
function lightWoodDoor(){
  if (_doorWood) return _doorWood;
  let sd = 7; const R = () => (sd = (sd*16807) % 2147483647)/2147483647;
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 512; const g = cv.getContext('2d');
  g.fillStyle = '#e6cfa9'; g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 90; i++){ g.fillStyle = `rgba(${150 + R()*40|0},${105 + R()*35|0},${60 + R()*30|0},${.05 + R()*.12})`; g.fillRect(R()*256, 0, .6 + R()*2.6, 512); }
  g.lineWidth = 1;
  for (let i = 0; i < 38; i++){ const x0 = R()*256, a = 1 + R()*3, ph = R()*6; g.strokeStyle = `rgba(140,98,56,${.07 + R()*.1})`; g.beginPath();
    for (let y = 0; y <= 512; y += 8){ const x = x0 + Math.sin(y/55 + ph)*a; y ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return _doorWood = new THREE.MeshStandardMaterial({map:t, roughness:.55});
}

  sun.position.set(Math.cos(az)*18, Math.sin(el)*20 + 3, -Math.sin(az)*10 + 8); sun.target.position.set(0, 0, 0);

/* ======================= 相機位姿 / 動畫 ======================= */
const ease = t => t < .5 ? 4*t*t*t : 1 - (-2*t + 2)**3/2;
const clamp01 = t => Math.max(0, Math.min(1, t));
const pose = (t, p) => ({t, p});
// 與當前 2D 視口完全重合的正俯視位姿：透視相機在該高度下，地面可視高度 = 2D 視口高度
function planPose(){
  const cx = view.x0 + SW()/2/view.s, cy = view.y0 + SH()/2/view.s, visH = SH()/view.s/1000;
  const dist = visH / 2 / Math.tan(FOV/2*Math.PI/180), t = new THREE.Vector3(wx(cx), 0, wz(cy));

}
function isoFrom(P){
  const d = THREE.MathUtils.clamp(P.p.y, 5, 30), dir = new THREE.Vector3(.3, .82, .49).normalize();
  return pose(P.t.clone(), P.t.clone().addScaledVector(dir, d));
}
const isoWhole = () => pose(new THREE.Vector3(0, 0, 0), new THREE.Vector3(5.5, 15.5, 10));

const curPose = () => pose(orbit.target.clone(), camera.position.clone());
// 以目標點為中心做球坐標插值：鏡頭沿弧線傾斜環繞，而不是直線穿越
function camTween(A, B, e){
  const t = A.t.clone().lerp(B.t, e);
  const sa = new THREE.Spherical().setFromVector3(A.p.clone().sub(A.t)), sb = new THREE.Spherical().setFromVector3(B.p.clone().sub(B.t));
  let dth = sb.theta - sa.theta; dth = Math.atan2(Math.sin(dth), Math.cos(dth));
  const s = new THREE.Spherical(sa.radius + (sb.radius - sa.radius)*e, sa.phi + (sb.phi - sa.phi)*e, sa.theta + dth*e);

}); }
function abort(){                                    // 切換失敗時還原 3D 狀態

}
const wait = ms => new Promise(r => setTimeout(r, ms));

function flyToRoom(id){
  const r = ROOMS.find(r => r.id === id), xs = r.poly.map(p => p[0]), ys = r.poly.map(p => p[1]);
  const t = new THREE.Vector3(wx((Math.min(...xs)+Math.max(...xs))/2), .6, wz((Math.min(...ys)+Math.max(...ys))/2));

  const dir = camera.position.clone().sub(orbit.target).setY(0); if (dir.lengthSq() < .01) dir.set(.6, 0, .8); dir.normalize();

/* ======================= 進入 / 退出 3D ======================= */
async function enter(){
  init(); active = true;
  renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH()); camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  sync(true);
  opt.mode = 'orbit'; orbit.enabled = false; showLabels(false);
  const A = planPose(), B = isoFrom(A);
  grow = 0; furnGrow = 0; applyGrow(); setPose(A);
  stage.classList.add('animating');
  startLoop(); renderer.render(scene, camera);
  stage.classList.add('is3d');                       // 交叉淡入：此刻 3D 畫面與 2D 平面完全重合
  await wait(420);
  await animate(1700, t => {
    camTween(A, B, ease(clamp01(t/.85)));
    grow = ease(clamp01((t - .1)/.55));

async function exit(){
  if (opt.mode === 'walk'){ walkCtl.unlock(); stopTouchWalk(); $('#hint3d').textContent = HINT_ORBIT; $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir); orbit.target.copy(camera.position).addScaledVector(dir, 3).setY(0); opt.mode = 'orbit'; syncModeBtns(); }
  fly = null; orbit.enabled = false; showLabels(false); stage.classList.add('animating');
  const A = curPose(), B = planPose();

    applyGrow();
  });
  stage.classList.remove('is3d');                    // 此刻 3D 已壓平為正俯視，與 2D 重合後淡出
  await wait(450);
  active = false; cancelAnimationFrame(raf); raf = 0;
  stage.classList.remove('animating');
  grow = furnGrow = 1; applyGrow();
}

/* ======================= 選擇 / 拾取 ======================= */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e){
  if (!e) ptr.set(0, 0);
  else { const r = renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); }
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([furnG, archUp, archFloor], true);
  for (const h of hits){
    let o = h.object;
    if (o.material === glassMat) continue;
    if (o.userData.door) return {door:o.userData.door, dist:h.distance};
    if (o.userData.room) return {room:o.userData.room};
    while (o && !o.userData.fid && o !== scene) o = o.parent;
    if (o?.userData.fid){ if (!o.visible) continue; return {fid:o.userData.fid}; }
    return null;                                     // 被牆體擋住
  }
  return null;
}
// 螢幕點 → 地面（y = 0）上的格局坐標 mm；s = 該處每 mm 對應的螢幕像素，用於拖放時的幽靈圖大小
const ground0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(x, y){
  if (!active || anim) return null;
  const r = renderer.domElement.getBoundingClientRect(), hit = new THREE.Vector3();
  ptr.set((x - r.left)/r.width*2 - 1, -(y - r.top)/r.height*2 + 1);
  ray.setFromCamera(ptr, camera);
  if (!ray.ray.intersectPlane(ground0, hit) || hit.distanceTo(camera.position) > 60) return null;
  // 視線先碰到牆體（或飄窗台）時，落點取碰到的位置，而不是穿過牆落到看不見的牆後
  const wall = ray.intersectObjects([archUp, archFloor], true).find(h => h.object.material !== glassMat && h.object.visible);
  if (wall && wall.distance < hit.distanceTo(camera.position) - .01) hit.set(wall.point.x, 0, wall.point.z);
  const px = v => new THREE.Vector2(v.x*r.width/2, v.y*r.height/2), a = px(hit.clone().project(camera));
  const s = Math.max(a.distanceTo(px(hit.clone().add(new THREE.Vector3(1, 0, 0)).project(camera))),
                     a.distanceTo(px(hit.clone().add(new THREE.Vector3(0, 0, 1)).project(camera)))) / 1000;
  return {x:hit.x*1000 + OX, y:hit.z*1000 + OY, s};
}
function updateSel(){
  const key = ui.sel?.kind === 'furn' ? ui.sel.id : '';
  if (key !== selKey){
    selKey = key;
    if (selHelper){ scene.remove(selHelper); selHelper.geometry.dispose(); selHelper = null; }
    const g = key && furnG.children.find(g => g.userData.fid === key);
    if (g){ selHelper = new THREE.BoxHelper(g, 0xb5653a); scene.add(selHelper); }
  }
  if (selHelper) selHelper.update();
}

/* ======================= 漫遊 ======================= */
// 觸控螢幕漫遊：左下虛擬搖桿移動，在畫面上拖曳轉向（iPad 不支持滑鼠指針鎖定）
const HINT_ORBIT = () => COARSE ? tr('單指旋轉 · 雙指縮放 / 平移 · 點門開關', '1 finger orbits · 2 fingers zoom / pan · tap doors to open')
  : tr('左鍵旋轉 · 右鍵平移 · 滾輪縮放 · 點擊門開關', 'Left-drag orbits · right-drag pans · scroll zooms · click doors to open');
const HINT_TOUCHWALK = () => tr('左下搖桿移動 · 拖曳畫面轉向 · 點門開關', 'Joystick moves · drag to look · tap doors to open');
const HINT_WALK = () => tr('WASD 移動 · 滑鼠轉向 · Shift 快走 · E 開關門 · Esc 暫停', 'WASD moves · mouse looks · Shift runs · E opens doors · Esc pauses');
function syncHint3d(){ $('#hint3d').textContent = opt.mode === 'orbit' ? HINT_ORBIT() : touchWalk ? HINT_TOUCHWALK() : HINT_WALK(); }
let touchWalk = false;
const joy = {x:0, y:0, id:null}, eul = new THREE.Euler(0, 0, 0, 'YXZ');
function lookBy(dx, dy){
  eul.setFromQuaternion(camera.quaternion);
  eul.y += dx * .005; eul.x = THREE.MathUtils.clamp(eul.x + dy * .005, -1.35, 1.35);
  camera.quaternion.setFromEuler(eul);
}
function startTouchWalk(){
  touchWalk = true;
  $('#walkOverlay').style.display = 'none'; $('#joy').style.display = 'block'; $('#walkExit').style.display = 'block';
  syncHint3d();
}
function stopTouchWalk(){
  touchWalk = false; joy.x = joy.y = 0; joy.id = null; $('#joy i').style.transform = '';
  $('#joy').style.display = 'none'; $('#walkExit').style.display = 'none';
}
function bindJoystick(){
  const el = $('#joy'), knob = $('#joy i'), R = 50;
  const upd = e => {
    const r = el.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const L = Math.hypot(dx, dy); if (L > R){ dx *= R/L; dy *= R/L; }

  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; el.setPointerCapture(e.pointerId); upd(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === joy.id) upd(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function setMode(m){
  if (anim) return;
  opt.mode = m; syncModeBtns();
  if (m === 'walk'){
    window.select(null);
    if (opt.cut < 3){ opt.cut = 3; syncCutBtns(); sync(); }
    orbit.enabled = false; fly = null;
    { const ed = DOORS.find(d => d.entry) || DOORS[0], cx = ed ? (ed.rect[0]+ed.rect[2])/2 : 4500, cy = ed ? (ed.rect[1]+ed.rect[3])/2 : 8000, o = ed ? ed.o : [0,-1];
      camera.position.set(wx(cx - o[0]*1500), 1.6, wz(cy - o[1]*1500)); camera.lookAt(wx(cx + o[0]*3000), 1.5, wz(cy + o[1]*3000)); }   // 入戶門外
    $('#walkOverlay').style.display = 'flex';
    syncHint3d();
  } else {
    walkCtl.unlock(); stopTouchWalk(); orbit.enabled = true;
    $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    syncHint3d();
    orbit.target.set(0, 0, 0); flyTo(isoWhole());
  }
  showLabels(opt.labels && m === 'orbit');
  archUp.traverse(o => { if (o.userData.walkOnly) o.visible = m === 'walk'; });
}
function blocked(x, z, r = .22){
  for (const [x0, z0, x1, z1] of colliders) if (x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r) return true;
  for (const d of doors){
    const a = d.pivot.rotation.y, px = d.pivot.position.x, pz = d.pivot.position.z, ex = px + Math.cos(a)*.9, ez = pz - Math.sin(a)*.9;
    const t = clamp01(((x-px)*(ex-px) + (z-pz)*(ez-pz)) / ((ex-px)**2 + (ez-pz)**2));
    if (Math.hypot(x - (px + t*(ex-px)), z - (pz + t*(ez-pz))) < r*.8) return true;
  }

}
function stepWalk(dt){
  if (!walkCtl.isLocked && !touchWalk) return;
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 2.6 : 1.4) * dt, fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x), mv = new THREE.Vector3();
  if (keys.KeyW || keys.ArrowUp) mv.add(fwd); if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
  if (keys.KeyD || keys.ArrowRight) mv.add(right); if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
  if (touchWalk){ mv.addScaledVector(fwd, -joy.y).addScaledVector(right, joy.x); }
  const mag = Math.min(1, mv.length());        // 搖桿推得越遠走得越快
  if (mag < .05) return;
  mv.normalize().multiplyScalar(sp * mag);
  const p = camera.position;
  if (!blocked(p.x + mv.x, p.z)) p.x += mv.x;
  if (!blocked(p.x, p.z + mv.z)) p.z += mv.z;
}
addEventListener('keydown', e => {
  if (!active || e.target.matches('input,select,textarea')) return;
  keys[e.code] = true;
  if (opt.mode === 'walk' && e.code === 'KeyE'){ const h = pick(); if (h?.door && h.dist < 2.5) h.door.open = !h.door.open; }
});
addEventListener('keyup', e => keys[e.code] = false);

/* ======================= 工具欄 ======================= */
function syncModeBtns(){ document.querySelectorAll('#modes3d .btn').forEach(b => b.classList.toggle('on', b.dataset.mode === opt.mode)); }
function syncCutBtns(){ document.querySelectorAll('[data-cut]').forEach(b => b.classList.toggle('on', +b.dataset.cut === opt.cut)); }
function syncWalkTexts(){
  const t = COARSE
    ? [tr('點擊開始，從入戶門進入', 'Tap to start at the front door'), tr('左下搖桿移動 · 在畫面上拖曳轉向', 'Joystick moves · drag on screen to look'),
       tr('點門開關 · 點「退出漫遊」回到鳥瞰', 'Tap doors to open · "Exit walk" returns to orbit')]
    : [tr('點擊開始，從入戶門進入', 'Click to start at the front door'),
       tr('<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移動 · 滑鼠轉向 · <kbd>Shift</kbd> 快走', '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · mouse looks · <kbd>Shift</kbd> runs'),
       tr('<kbd>E</kbd> 開關正前方的門 · <kbd>Esc</kbd> 暫停', '<kbd>E</kbd> opens the door ahead · <kbd>Esc</kbd> pauses')];
  t.forEach((h, i) => $('#wo' + (i + 1)).innerHTML = h);
  syncHint3d();
}
function bindUI(){
  document.querySelectorAll('#modes3d .btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  // 觸控螢幕設備用搖桿漫遊；桌面端鎖定滑鼠，鎖定失敗時也退回到搖桿
  $('#walkOverlay').onclick = () => COARSE ? startTouchWalk() : walkCtl.lock();
  document.addEventListener('pointerlockerror', () => { if (active && opt.mode === 'walk') startTouchWalk(); });
  $('#walkExit').onclick = () => setMode('orbit');
  bindJoystick();
  syncWalkTexts();
  $('#vIso').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); else flyTo(isoWhole()); };
  $('#vTop').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); flyTo(topWhole()); };
  document.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => { if (opt.mode === 'walk') return; opt.cut = +b.dataset.cut; syncCutBtns(); sync(); });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const k = b.dataset.t; opt[k] = !opt[k]; b.classList.toggle('on', opt[k]);
    if (k === 'furn' || k === 'cab' || k === 'curt') applyFurnVis();
    if (k === 'labels') showLabels(opt.labels && opt.mode === 'orbit' && !anim);
    if (k === 'night') applyLight();
  });
  $('#sun').oninput = e => { opt.hour = +e.target.value; applyLight(); };
}

/* ======================= 主循環 ======================= */
const clock = new THREE.Clock();
function startLoop(){ if (!raf){ clock.getDelta(); raf = requestAnimationFrame(loop); } }
function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), now = performance.now();
  if (anim){ const t = clamp01((now - anim.t0)/anim.dur); anim.fn(t); if (t >= 1){ const r = anim.res; anim = null; r(); } }
  else if (fly){ const t = clamp01((now - fly.t0)/fly.dur); camTween(fly.A, fly.B, ease(t)); if (t >= 1) fly = null; }
  else if (opt.mode === 'orbit') orbit.update();
  else stepWalk(dt);
  doors.forEach(d => { const tg = d.open ? d.a1 : d.a0; d.cur += (tg - d.cur) * Math.min(1, dt*6); d.pivot.rotation.y = d.cur; });
  updateSel();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

function shot(){ const a = document.createElement('a'); a.download = tr('格局裝修方案', 'floor-plan-design') + '-3D.png'; renderer.render(scene, camera); a.href = renderer.domElement.toDataURL('image/png'); a.click(); }

function relang(){ syncWalkTexts(); if (inited) buildLabels(); }

/* ======================= 模型庫懸停預覽：獨立的小型 renderer，不影響主 3D 場景 ======================= */
let pv = null;
function pvInit(){
  if (pv) return pv;
  const cv = document.createElement('canvas'), r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); r.setSize(260, 200, false); r.setClearColor(0xffffff, 1);
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  const pm = new THREE.PMREMGenerator(r); pvEnv = pm.fromScene(new RoomEnvironment(), .04).texture; pm.dispose();
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 260/200, .1, 60);
  sc.add(new THREE.HemisphereLight(0xfff8ee, 0xb9a88f, 1.15));
  const sun = new THREE.DirectionalLight(0xfff1dd, 2.4); sun.position.set(2.4, 4.2, 3.2); sun.castShadow = true; sun.shadow.mapSize.setScalar(1024);
  Object.assign(sun.shadow.camera, {left:-3, right:3, top:3, bottom:-3, near:.5, far:14}); sun.shadow.bias = -.0005; sun.shadow.normalBias = .02;
  sun.target.position.set(0, 1, 0); sc.add(sun, sun.target);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({color:'#eee8dc', roughness:1})); floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshStandardMaterial({color:'#f8f5ef', roughness:1})); wall.receiveShadow = true;
  // 預覽只顯示櫃體：不放地板與牆面，背景純白
  return pv = {cv, r, sc, cam, wall, model:null, raf:0, t0:0, tgt:new THREE.Vector3(), dist:4};
}
function pvClear(){
  if (!pv) return; cancelAnimationFrame(pv.raf); pv.raf = 0;
  if (pv.model){ pv.model.traverse(o => { if (o.geometry) o.geometry.dispose(); }); pv.sc.remove(pv.model); pv.model = null; }
}
function preview(f0){
  try {
    const P = pvInit(); pvClear();
    const f = {id:'__pv', cx:0, cy:0, rot:0, ...f0};
    let g; PV = true; try { g = buildFurniture(f); } finally { PV = false; }
    deZ(g); g.position.x = 0; g.position.z = 0; g.rotation.y = 0;
    P.sc.add(g); P.model = g;
    const bb = new THREE.Box3().setFromObject(g), sz = bb.getSize(new THREE.Vector3()), ct = bb.getCenter(new THREE.Vector3());
    P.tgt.set(0, ct.y, 0); P.wall.position.set(0, 2.5, bb.min.z - .015);
    const half = Math.tan(P.cam.fov*Math.PI/360), span = Math.max(sz.y*1.15, sz.x*.75, sz.z*1.1);
    P.dist = Math.max(2.2, span/(2*half)*1.2 + sz.z*.5);
    const a = .5, el = .26;   // 固定視角（正面微側），不旋轉
    P.cam.position.set(P.tgt.x + Math.sin(a)*P.dist*Math.cos(el), P.tgt.y + Math.sin(el)*P.dist, P.tgt.z + Math.cos(a)*P.dist*Math.cos(el)); P.cam.lookAt(P.tgt);
    P.r.render(P.sc, P.cam); P.raf = requestAnimationFrame(() => P.r.render(P.sc, P.cam));
    return P.cv;
  } catch (e){ PV = false; console.warn('預覽建立失敗', e); return null; }
}
const previewStop = () => pvClear();
window.View3D = {enter, exit, abort, relang, sync:() => sync(), shot, groundAt, flyToRoom:id => active && !anim && flyToRoom(id), walking:() => active && opt.mode === 'walk', preview, previewStop};
</script>
<script>
/* 左右面板：隱藏滾軸線，只在可捲動時顯示上下箭頭（可按住連續捲動；滾輪 / 觸控仍可直接捲） */
document.querySelectorAll('aside').forEach(a => {
  const mk = (cls, ch, dir) => { const d = document.createElement('div'); d.className = 'sarrow ' + cls + ' off'; const b = document.createElement('button'); b.type = 'button'; b.textContent = ch; b.setAttribute('aria-label', dir < 0 ? '往上捲動' : '往下捲動'); d.appendChild(b);
    let raf = 0; const step = () => { a.scrollTop += dir*8; raf = requestAnimationFrame(step); }, stop = () => cancelAnimationFrame(raf);
    b.addEventListener('pointerdown', e => { e.preventDefault(); stop(); step(); });
    ['pointerup','pointercancel','pointerleave'].forEach(t => b.addEventListener(t, stop)); return d; };
  const up = mk('up', '▲', -1), dn = mk('dn', '▼', 1); a.insertBefore(up, a.firstChild); a.appendChild(dn);
  const upd = () => { up.classList.toggle('off', a.scrollTop < 4); dn.classList.toggle('off', a.scrollTop + a.clientHeight >= a.scrollHeight - 4); };
  a.addEventListener('scroll', upd, {passive:true}); window.addEventListener('resize', upd);
  if (window.ResizeObserver) new ResizeObserver(upd).observe(a);
  new MutationObserver(upd).observe(a, {childList:true, subtree:true}); upd();
});
</script>
